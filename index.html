<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe Game</title>
<style>
/* =======================
       RGB BACKGROUND
======================= */
body {
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    padding: 20px;
    height: 100vh;
    margin: 0;
    overflow-x: hidden;
    animation: rgbBG 15s infinite alternate;
}

@keyframes rgbBG {
    0% { background: #111; }
    25% { background: #19002e; }
    50% { background: #001f3f; }
    75% { background: #003321; }
    100% { background: #330000; }
}

h1 { font-size: 28px; margin-bottom: 8px; }

/* =======================
        BUTTONS
======================= */
#controls { margin: 12px auto; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; align-items:center; }

select, button {
    padding: 8px 12px;
    margin: 5px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
}

#resetBtn {
    background:#e63946;
    color:white;
    transition: .25s;
}
#resetBtn:hover { background:#ff4b5c; }

/* =======================
        BOARD
======================= */
#boardWrap { width: max-content; margin: 18px auto; }
#board {
    display: grid;
    gap: 6px;
    background: transparent;
}

.cell {
    background: rgba(0,0,0,0.35);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border-radius: 12px;
    transition: .18s;
    font-weight: bold;
    user-select: none;

    /* GARIS BORDER NEON */
    border: 3px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 8px rgba(0,255,255,0.25);
}
.cell:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(0,255,255,0.8);
    box-shadow: 0 0 12px rgba(0,255,255,0.9);
}

/* X and O */
.xmark {
    color: #4cc9f0;
    text-shadow: 0 0 10px #4cc9f0 !important;
    border: 3px solid #4cc9f0 !important;
    box-shadow: 0 0 12px #4cc9f0 !important;
}
.omark {
    color: #ffbe0b;
    text-shadow: 0 0 10px #ffbe0b !important;
    border: 3px solid #ffbe0b !important;
    box-shadow: 0 0 12px #ffbe0b !important;
}

/* responsive sizes */
.size-3 .cell { width: 100px; height: 100px; font-size:52px; }
.size-4 .cell { width: 78px; height: 78px; font-size:40px; }
.size-5 .cell { width: 60px; height: 60px; font-size:30px; }

/* pop */
.pop { animation: pop .25s ease; }
@keyframes pop { from{transform:scale(.3);opacity:0} to{transform:scale(1);opacity:1} }

/* win highlight */
.win {
    animation: winGlow 0.6s ease alternate infinite;
    border-color: white !important;
    box-shadow: 0 0 20px white !important;
}
@keyframes winGlow {
    0% { background: rgba(255,255,255,0.2); }
    100% { background: rgba(255,255,255,0.45); }
}

/* CONFETTI */
.confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 12px;
    opacity: 0.95;
    border-radius: 2px;
    animation: fall linear forwards;
}
@keyframes fall { from{transform:translateY(0)} to{transform:translateY(120vh)} }

/* WIN SCREEN */
#winScreen {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}
#winMessage { font-size:44px; font-weight:700; margin-bottom:18px; }
#closeWinBtn { background:#00bbf9; padding:10px 18px; border-radius:10px; font-size:16px; cursor:pointer; }

/* status */
#status { margin-top: 10px; font-size: 20px; font-weight:600; }

</style>
<link rel="manifest" href="manifest.json">
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js");}</script>
</head>
<body>
<h1>Tic Tac Toe By Wira</h1>

<div id="controls">
    <label>Mode:
        <select id="modeSelect" onchange="onModeChange()">
            <option value="pvp">Player vs Player</option>
            <option value="ai">Player vs AI</option>
        </select>
    </label>

    <label id="aiLevelLabel" style="display:none;">AI Level:
        <select id="aiLevel" style="display:none;" onchange="onAIChange()">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard" selected>Hard</option>
        </select>
    </label>

    <label>Board:
        <select id="boardSize" onchange="onBoardSizeChange()">
            <option value="3" selected>3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5">5 × 5</option>
        </select>
    </label>

    <button id="musicBtn" onclick="toggleMusic()">🔊 Music: ON</button>
    <button id="resetBtn" onclick="resetGame()">🔄 Reset Game</button>
</div>

<div id="boardWrap"><div id="board" class="size-3"></div></div>
<div id="status">Giliran: X</div>

<!-- WIN SCREEN -->
<div id="winScreen">
    <div id="winMessage"></div>
    <button id="closeWinBtn" onclick="hideWinScreen()">Main Lagi</button>
</div>

<script>
/* ============================
    GLOBAL / INITIAL VALUES
============================= */
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const winScreen = document.getElementById('winScreen');
const winMessage = document.getElementById('winMessage');

let size = 3;                // board size (3,4,5)
let winLen = 3;              // in-a-row to win (== size for A)
let board = [];
let currentPlayer = 'X';
let gameOver = false;

let mode = 'pvp';            // 'pvp' or 'ai'
let aiLevel = 'hard';        // easy / medium / hard

// audios (ensure these files exist)
let bgMusic = new Audio('backsound.mp3'); bgMusic.loop = true; bgMusic.volume = 0.45;
let clickSFX = new Audio('Click.mp3');
let winSFX = new Audio('WinGame.mp3');

document.addEventListener('click', ()=> bgMusic.play(), { once:true });

/* ============================
    BOARD INIT & RENDER
============================= */
function setupBoard(newSize){
    size = newSize;
    winLen = newSize; // per choice A: win length == board size
    board = Array(size*size).fill('');
    currentPlayer = 'X';
    gameOver = false;

    // set board grid template
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    boardEl.classList.remove('size-3','size-4','size-5');
    boardEl.classList.add(`size-${size}`);

    renderBoard();
    updateStatus();
}

function renderBoard(){
    boardEl.innerHTML = '';
    for (let i=0;i<board.length;i++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.onclick = ()=> onCellClick(i);
        cell.textContent = board[i];
        // style size handled via CSS classes (size-N)
        boardEl.appendChild(cell);
    }
}

function updateStatus(){
    statusEl.textContent = (gameOver) ? 'Game selesai' : `Giliran: ${currentPlayer}`;
}

/* ============================
    UI events (controls)
============================= */
function onModeChange(){
    mode = document.getElementById('modeSelect').value;
    const label = document.getElementById('aiLevelLabel');
    const select = document.getElementById('aiLevel');
    if (mode === 'ai'){ label.style.display='inline-block'; select.style.display='inline-block'; }
    else { label.style.display='none'; select.style.display='none'; }
    resetGame();
}

function onAIChange(){
    aiLevel = document.getElementById('aiLevel').value;
}

function onBoardSizeChange(){
    const newSize = parseInt(document.getElementById('boardSize').value,10);
    setupBoard(newSize);
}

/* ============================
    Cell click handler
============================= */
function onCellClick(idx){
    if (gameOver || board[idx] !== '') return;

    board[idx] = currentPlayer;
    refreshCell(idx);
    playClick();

    if (checkForWin()) return;

    // switch player
    currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
    updateStatus();

    // AI turn if applicable
    if (!gameOver && mode === 'ai' && currentPlayer === 'O'){
        setTimeout(()=> aiMakeMove(), 300);
    }
}

function refreshCell(i){
    const cell = boardEl.querySelector(`.cell[data-index="${i}"]`);
    if (!cell) return;
    cell.textContent = board[i];
    cell.classList.remove('xmark','omark','pop');
    if (board[i] === 'X') cell.classList.add('xmark','pop');
    if (board[i] === 'O') cell.classList.add('omark','pop');
}

/* ============================
      SOUND helpers
============================= */
function playClick(){ clickSFX.currentTime = 0; clickSFX.play().catch(()=>{}); }
function playWin(){ winSFX.currentTime = 0; winSFX.play().catch(()=>{}); }

/* ============================
       WIN CHECKING (generic)
   checks rows, cols, diag for winLen contiguous
============================= */
function checkForWin(){
    const lines = computeAllLines(size, winLen);
    // check each line for contiguous same marks of length winLen
    for (let line of lines){
        // line is array of indexes length == winLen
        const first = board[line[0]];
        if (first === '') continue;
        let won = true;
        for (let k=1;k<line.length;k++){
            if (board[line[k]] !== first){ won = false; break; }
        }
        if (won){
            // highlight winning cells
            line.forEach(i => {
                const c = boardEl.querySelector(`.cell[data-index="${i}"]`);
                if (c) c.classList.add('win');
            });
            gameOver = true;
            playWin();
            confettiBurst();
            showWinPopup(first);
            updateStatus();
            return true;
        }
    }

    // draw?
    if (!board.includes('')){
        gameOver = true;
        showWinPopup('draw');
        updateStatus();
        return true;
    }
    return false;
}

/* compute all possible winning lines (rows, cols, diagonals)
   for a size×size board requiring winLen consecutive cells
   This generates sequences of length winLen sliding over rows/cols/diags.
*/
function computeAllLines(size, winLen){
    const lines = [];

    // rows
    for (let r=0;r<size;r++){
        for (let start=0; start<=size-winLen; start++){
            const seq = [];
            for (let k=0;k<winLen;k++) seq.push(r*size + (start+k));
            lines.push(seq);
        }
    }

    // cols
    for (let c=0;c<size;c++){
        for (let start=0; start<=size-winLen; start++){
            const seq = [];
            for (let k=0;k<winLen;k++) seq.push((start+k)*size + c);
            lines.push(seq);
        }
    }

    // diag down-right (\)
    for (let r=0;r<=size-winLen;r++){
        for (let c=0;c<=size-winLen;c++){
            const seq = [];
            for (let k=0;k<winLen;k++) seq.push((r+k)*size + (c+k));
            lines.push(seq);
        }
    }

    // diag up-right (/)
    for (let r=winLen-1; r<size; r++){
        for (let c=0; c<=size-winLen; c++){
            const seq = [];
            for (let k=0;k<winLen;k++) seq.push((r-k)*size + (c+k));
            lines.push(seq);
        }
    }

    return lines;
}

/* ============================
        AI: move selection
   For size==3 use minimax full (unbeatable).
   For size 4/5 use:
     - immediate win
     - immediate block
     - heuristic scoring (count contiguous)
============================= */
function aiMakeMove(){
    if (gameOver) return;
    let move = -1;

    if (aiLevel === 'easy'){
        move = randomMove();
    } else if (aiLevel === 'medium'){
        if (Math.random() < 0.5) move = randomMove();
        else move = aiHardMove();
    } else { // hard
        move = aiHardMove();
    }

    if (move < 0) move = randomMove();
    board[move] = 'O';
    refreshCell(move);
    playClick();

    if (checkForWin()) return;
    currentPlayer = 'X';
    updateStatus();
}

function randomMove(){
    const empty = board.map((v,i)=> v===''?i:null).filter(v=> v!==null);
    if (!empty.length) return -1;
    return empty[Math.floor(Math.random()*empty.length)];
}

function aiHardMove(){
    // for 3x3 use minimax
    if (size === 3){
        const best = minimax3(board.slice(), 'O');
        return (best && typeof best.index === 'number') ? best.index : randomMove();
    }

    // for larger boards: try immediate win
    const empty = board.map((v,i)=> v===''?i:null).filter(v=> v!==null);

    // immediate win
    for (let idx of empty){
        board[idx] = 'O';
        if (winsNow('O')) { board[idx] = ''; return idx; }
        board[idx] = '';
    }
    // immediate block
    for (let idx of empty){
        board[idx] = 'X';
        if (winsNow('X')) { board[idx] = ''; return idx; }
        board[idx] = '';
    }

    // heuristic: evaluate moves choose best score
    let bestScore = -Infinity;
    let bestMove = -1;
    for (let idx of empty){
        board[idx] = 'O';
        const score = heuristicScore(board, 'O') - 0.1*heuristicScore(board,'X'); // favor own lines
        board[idx] = '';
        if (score > bestScore){
            bestScore = score;
            bestMove = idx;
        }
    }
    return (bestMove>=0) ? bestMove : randomMove();
}

function winsNow(player){
    const lines = computeAllLines(size, winLen);
    for (let line of lines){
        if (line.every(i => board[i] === player)) return true;
    }
    return false;
}

/* heuristicScore: count sequences where player has marks and opponent none
   weighted by length of contiguous tokens in those sequences.
*/
function heuristicScore(bd, player){
    const opponent = (player === 'X') ? 'O' : 'X';
    const lines = computeAllLines(size, winLen);
    let score = 0;

    for (let line of lines){
        let countPlayer = 0, countOpp = 0;
        for (let idx of line){
            if (bd[idx] === player) countPlayer++;
            if (bd[idx] === opponent) countOpp++;
        }
        if (countOpp === 0 && countPlayer>0){
            // more consecutive -> more valuable
            score += Math.pow(10, countPlayer); // 10^n
        } else if (countPlayer === 0 && countOpp>0){
            score -= Math.pow(10, countOpp);
        }
    }
    return score;
}

/* minimax for 3x3 only (classic) */
function minimax3(boardState, player){
    const avail = boardState.map((v,i)=> v===''?i:null).filter(v=> v!==null);
    const winner = checkWinnerStatic(boardState);
    if (winner === 'O') return {score: 10};
    if (winner === 'X') return {score: -10};
    if (!avail.length) return {score:0};

    const moves = [];
    for (let i of avail){
        const move = {};
        move.index = i;
        boardState[i] = player;
        if (player === 'O'){
            const result = minimax3(boardState, 'X');
            move.score = result.score;
        } else {
            const result = minimax3(boardState, 'O');
            move.score = result.score;
        }
        boardState[i] = '';
        moves.push(move);
    }

    let bestMove;
    if (player === 'O'){
        let bestScore = -Infinity;
        moves.forEach((m,i)=> { if (m.score > bestScore){ bestScore = m.score; bestMove = i; }});
    } else {
        let bestScore = Infinity;
        moves.forEach((m,i)=> { if (m.score < bestScore){ bestScore = m.score; bestMove = i; }});
    }
    return moves[bestMove];
}

function checkWinnerStatic(bd){
    const lines = computeAllLines(size, winLen); // for 3x3 works
    for (let line of lines){
        const first = bd[line[0]];
        if (first === '') continue;
        let ok = true;
        for (let k=1;k<line.length;k++) if (bd[line[k]] !== first){ ok=false; break; }
        if (ok) return first;
    }
    return null;
}

/* ============================
        WIN POPUP & CONFETTI
============================= */
function confettiBurst(){
    for (let i=0;i<40;i++){
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random()*100 + '%';
        c.style.background = `hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration = (1 + Math.random()*1.2) + 's';
        document.body.appendChild(c);
        setTimeout(()=> c.remove(), 2200);
    }
}

function showWinPopup(winner){
    winScreen.style.display = 'flex';
    if (winner === 'draw') { winMessage.textContent = 'DRAW!'; }
    else {
        if (mode === 'pvp'){
            winMessage.textContent = (winner === 'X') ? 'PLAYER 1 WIN!' : 'PLAYER 2 WIN!';
        } else {
            winMessage.textContent = (winner === 'X') ? 'YOU WIN!' : 'YOU LOSE!';
        }
    }
}

function hideWinScreen(){
    winScreen.style.display = 'none';
    resetGame();
}

/* ============================
        helper: checkForWin wrapper
   (this version uses computeAllLines which already slides sequences)
============================= */
// already implemented as checkForWin() above

/* ============================
        TOGGLES & RESET
============================= */
function toggleMusic(){
    const btn = document.getElementById('musicBtn');
    if (bgMusic.paused){ bgMusic.play(); btn.textContent='🔊 Music: ON'; }
    else { bgMusic.pause(); btn.textContent='🔇 Music: OFF'; }
}

function resetGame(){
    board = Array(size*size).fill('');
    currentPlayer = 'X';
    gameOver = false;
    renderBoard();
    updateStatus();
    // remove any win classes
    [...document.querySelectorAll('.cell')].forEach(c => c.classList.remove('win'));
}

/* ============================
        INITIAL SETUP
============================= */
setupBoard(3); // default 3x3

</script>
</body>
</html>
